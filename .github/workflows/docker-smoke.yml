name: Docker smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      COMPOSE_PARALLEL_LIMIT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose --project-name drn-stack -f compose.yaml config --quiet
          for profile_file in profiles/*/compose.yaml; do
            docker compose --project-name drn-stack \
              -f compose.yaml -f "${profile_file}" config --quiet
          done
          for gpu_file in profiles/*/compose.gpu.yaml; do
            profile_dir="$(dirname "${gpu_file}")"
            for renderer_file in \
              "${gpu_file}" "${profile_dir}/compose.software.yaml"; do
              docker compose --project-name drn-stack \
                -f compose.yaml \
                -f "${profile_dir}/compose.yaml" \
                -f "${renderer_file}" config --quiet
            done
          done
          DRN_HARDWARE_BIND_ADDRESS=192.0.2.10 \
          DRN_HARDWARE_ARTIFACTS=/tmp/drn-hardware \
            docker compose --project-name drn-stack \
              -f compose.yaml \
              -f profiles/x500-basic/compose.yaml \
              -f connections/hardware-udp/compose.yaml config --quiet

      - name: Build pinned images
        run: |
          docker compose --project-name drn-stack -f compose.yaml build --progress plain ros-viz
          docker compose --project-name drn-stack -f compose.yaml build --progress plain px4-sitl

      - name: Start stack
        run: docker compose --project-name drn-stack -f compose.yaml up -d --wait --wait-timeout 300

      - name: Verify PX4, ROS topics, TF, and Foxglove
        run: bash scripts/simctl.sh smoke

      - name: Capture logs on failure
        if: failure()
        run: docker compose --project-name drn-stack -f compose.yaml logs --no-color --tail=500

      - name: Stop stack
        if: always()
        run: docker compose --project-name drn-stack -f compose.yaml down --remove-orphans --volumes --timeout 30

      - name: Start x500-depth profile
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            up -d --no-build --wait --wait-timeout 300

      - name: Verify depth images, calibration, TF, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-depth

      - name: Capture x500-depth logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            logs --no-color --tail=500

      - name: Stop x500-depth profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Start x500-vio profile
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-vio/compose.yaml \
            up -d --no-build --wait --wait-timeout 300

      - name: Verify vision odometry frames, values, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-vio

      - name: Capture x500-vio logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-vio/compose.yaml \
            logs --no-color --tail=500

      - name: Stop x500-vio profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-vio/compose.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Start x500-lidar profile and record resource baseline
        run: |
          started_at="$(date +%s)"
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-lidar/compose.yaml \
            -f profiles/x500-lidar/compose.software.yaml \
            up -d --no-build --wait --wait-timeout 300
          startup_seconds="$(($(date +%s) - started_at))"
          px4_bytes="$(docker image inspect \
            drn-stack/px4-sitl:v1.17.0 --format '{{.Size}}')"
          ros_bytes="$(docker image inspect \
            drn-stack/ros-viz:humble --format '{{.Size}}')"
          {
            echo '### x500-lidar resource baseline'
            echo
            echo "- Startup to healthy: ${startup_seconds} seconds"
            echo "- PX4 image: ${px4_bytes} bytes"
            echo "- ROS image: ${ros_bytes} bytes"
            echo
            echo '| Container | CPU | Memory | PIDs |'
            echo '| --- | ---: | ---: | ---: |'
            docker stats --no-stream \
              --format '| {{.Name}} | {{.CPUPerc}} | {{.MemUsage}} | {{.PIDs}} |' \
              drn-stack-ros-viz-1 drn-stack-px4-sitl-1
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${startup_seconds}" -le 300

      - name: Verify LiDAR scan, TF, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-lidar

      - name: Capture x500-lidar logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-lidar/compose.yaml \
            -f profiles/x500-lidar/compose.software.yaml \
            logs --no-color --tail=500

      - name: Stop x500-lidar profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-lidar/compose.yaml \
            -f profiles/x500-lidar/compose.software.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Start x500 precision-landing profile
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-precision-land/compose.yaml \
            -f profiles/x500-precision-land/compose.software.yaml \
            up -d --no-build --wait --wait-timeout 300

      - name: Verify landing perception, services, TF, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-precision-land

      - name: Capture x500 precision-landing logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-precision-land/compose.yaml \
            -f profiles/x500-precision-land/compose.software.yaml \
            logs --no-color --tail=500

      - name: Stop x500 precision-landing profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-precision-land/compose.yaml \
            -f profiles/x500-precision-land/compose.software.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Start x500-multi profile and record resource baseline
        run: |
          started_at="$(date +%s)"
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            up -d --no-build --wait --wait-timeout 300
          startup_seconds="$(($(date +%s) - started_at))"
          {
            echo '### x500-multi resource baseline'
            echo
            echo "- Startup to healthy: ${startup_seconds} seconds"
            echo
            echo '| Container | CPU | Memory | PIDs |'
            echo '| --- | ---: | ---: | ---: |'
            docker stats --no-stream \
              --format '| {{.Name}} | {{.CPUPerc}} | {{.MemUsage}} | {{.PIDs}} |' \
              drn-stack-ros-viz-1 drn-stack-px4-sitl-1
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${startup_seconds}" -le 300

      - name: Verify fleet namespaces, TF, telemetry, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-multi

      - name: Capture x500-multi logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            logs --no-color --tail=500

      - name: Stop x500-multi profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Start maximum four-vehicle profile and record resource baseline
        env:
          DRN_FLEET_SIZE: "4"
        run: |
          started_at="$(date +%s)"
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            up -d --no-build --wait --wait-timeout 300
          startup_seconds="$(($(date +%s) - started_at))"
          {
            echo '### x500-multi four-vehicle resource baseline'
            echo
            echo "- Startup to healthy: ${startup_seconds} seconds"
            echo
            echo '| Container | CPU | Memory | PIDs |'
            echo '| --- | ---: | ---: | ---: |'
            docker stats --no-stream \
              --format '| {{.Name}} | {{.CPUPerc}} | {{.MemUsage}} | {{.PIDs}} |' \
              drn-stack-ros-viz-1 drn-stack-px4-sitl-1
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${startup_seconds}" -le 300

      - name: Verify maximum fleet namespaces, TF, telemetry, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-multi --vehicle-count 4

      - name: Capture maximum x500-multi logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            logs --no-color --tail=500

      - name: Stop maximum x500-multi profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-multi/compose.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Run inert downstream-project scenario
        env:
          DRN_EVIDENCE: "1"
          DRN_EVIDENCE_ROOT: ${{ github.workspace }}/artifacts
          DRN_MIN_HOST_FREE_GB: "0"
        run: bash scripts/run-scenario.sh projects/example_inspection startup-health

      - name: Detect scenario evidence pack
        if: always()
        id: scenario_evidence
        run: |
          if [[ -d artifacts ]] && \
            find artifacts -type f -print -quit | grep -q .; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload scenario evidence pack
        if: always() && steps.scenario_evidence.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
