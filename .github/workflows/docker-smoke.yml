name: Docker smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      COMPOSE_PARALLEL_LIMIT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose --project-name drn-stack -f compose.yaml config --quiet
          for profile in x500-basic x500-depth; do
            docker compose --project-name drn-stack \
              -f compose.yaml -f "profiles/${profile}/compose.yaml" config --quiet
          done
          docker compose --project-name drn-stack \
            -f compose.yaml \
            -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.gpu.yaml config --quiet
          docker compose --project-name drn-stack \
            -f compose.yaml \
            -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml config --quiet

      - name: Build pinned images
        run: |
          docker compose --project-name drn-stack -f compose.yaml build --progress plain ros-viz
          docker compose --project-name drn-stack -f compose.yaml build --progress plain px4-sitl

      - name: Start stack
        run: docker compose --project-name drn-stack -f compose.yaml up -d --wait --wait-timeout 300

      - name: Verify PX4, ROS topics, TF, and Foxglove
        run: bash scripts/simctl.sh smoke

      - name: Capture logs on failure
        if: failure()
        run: docker compose --project-name drn-stack -f compose.yaml logs --no-color --tail=500

      - name: Stop stack
        if: always()
        run: docker compose --project-name drn-stack -f compose.yaml down --remove-orphans --volumes --timeout 30

      - name: Start x500-depth profile
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            up -d --no-build --wait --wait-timeout 300

      - name: Verify depth images, calibration, TF, and inert state
        run: bash scripts/simctl.sh smoke --profile x500-depth

      - name: Capture x500-depth logs on failure
        if: failure()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            logs --no-color --tail=500

      - name: Stop x500-depth profile
        if: always()
        run: |
          docker compose --project-name drn-stack \
            -f compose.yaml -f profiles/x500-depth/compose.yaml \
            -f profiles/x500-depth/compose.software.yaml \
            down --remove-orphans --volumes --timeout 30

      - name: Run inert downstream-project scenario
        env:
          DRN_EVIDENCE: "1"
          DRN_EVIDENCE_ROOT: ${{ github.workspace }}/artifacts
          DRN_MIN_HOST_FREE_GB: "0"
        run: bash scripts/run-scenario.sh projects/example_inspection startup-health

      - name: Upload scenario evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
