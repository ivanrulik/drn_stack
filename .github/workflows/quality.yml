name: Lint and ROS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-lint:
    name: Repository lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint

      - name: Run repository lint
        shell: bash
        run: bash scripts/lint.sh

  ros-build-test:
    name: ROS build and ament tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ROS workspace and run tests
        shell: bash
        run: bash scripts/test-ros-build.sh
